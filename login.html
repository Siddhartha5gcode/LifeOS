<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log in / Sign up | LifeOS</title>
  <meta name="description" content="Log in or create a new LifeOS account.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Open Sans', Arial, sans-serif;
      background: #f0f2f5;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ── NAVBAR ─────────────────────────────────────── */
    .navbar {
      background: #fff;
      border-bottom: 1px solid #dde1e7;
      padding: 0 2rem;
      height: 60px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 1px 4px rgba(0,0,0,.06);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .nav-logo {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
    }

    .nav-logo-icon {
      width: 42px;
      height: 42px;
      background: linear-gradient(135deg, #1a3fc4, #0d6efd);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 1.2rem;
      font-weight: 900;
      box-shadow: 0 2px 8px rgba(13,110,253,.3);
    }

    .nav-logo-text {
      font-size: 1.35rem;
      font-weight: 800;
      color: #1a1a2e;
    }

    .nav-logo-text span { color: #0d6efd; }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .nav-links a {
      text-decoration: none;
      color: #555;
      font-size: 0.78rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .6px;
      padding: 6px 10px;
      border-radius: 6px;
      transition: all .18s;
    }

    .nav-links a:hover { background: #f0f2f5; color: #0d6efd; }
    .nav-links a.active { color: #0d6efd; }

    .nav-search {
      width: 32px;
      height: 32px;
      background: #0d6efd;
      color: #fff;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: .82rem;
      cursor: pointer;
      margin-left: 4px;
    }

    /* ── BLUE BANNER ────────────────────────────────── */
    .page-banner {
      background: #1a3fc4;
      background: linear-gradient(135deg, #1a3fc4 0%, #0d6efd 100%);
      color: #fff;
      text-align: center;
      padding: 18px 20px;
    }

    .page-banner h1 {
      font-size: 1.6rem;
      font-weight: 700;
      letter-spacing: .3px;
    }

    /* ── MAIN GRID ──────────────────────────────────── */
    .page-body {
      max-width: 1100px;
      margin: 36px auto 60px;
      padding: 0 20px;
      width: 100%;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 28px;
      align-items: start;
    }

    @media (max-width: 800px) {
      .page-body { grid-template-columns: 1fr; }
    }

    /* ── CARD ───────────────────────────────────────── */
    .card {
      background: #fff;
      border-radius: 10px;
      padding: 28px 26px 32px;
      box-shadow: 0 2px 12px rgba(0,0,0,.07);
      border: 1px solid #e4e8ef;
    }

    .card-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 22px;
    }

    .card-title {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 1.2rem;
      font-weight: 800;
      color: #1a1a2e;
    }

    .card-title i {
      color: #0d6efd;
      font-size: 1.25rem;
    }

    .req-note {
      font-size: 0.7rem;
      color: #999;
      font-style: italic;
    }

    /* ── SOCIAL BUTTONS ─────────────────────────────── */
    .social-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 18px;
    }

    .btn-fb {
      background: #1877f2;
      color: #fff;
      border: none;
      padding: 10px 8px;
      border-radius: 6px;
      font-size: .82rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      transition: background .18s;
    }

    .btn-fb:hover { background: #1464d4; }

    .btn-google {
      background: #fff;
      color: #444;
      border: 1px solid #dde1e7;
      padding: 10px 8px;
      border-radius: 6px;
      font-size: .82rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      transition: background .18s;
    }

    .btn-google:hover { background: #f5f7fa; }

    /* ── OR DIVIDER ─────────────────────────────────── */
    .or-line {
      position: relative;
      text-align: center;
      margin: 16px 0;
    }

    .or-line::before {
      content: '';
      position: absolute;
      left: 0; right: 0; top: 50%;
      height: 1px;
      background: #e4e8ef;
    }

    .or-line span {
      position: relative;
      background: #fff;
      padding: 0 12px;
      font-size: .78rem;
      color: #999;
      font-style: italic;
    }

    /* ── FORM FIELDS ────────────────────────────────── */
    .field { margin-bottom: 12px; }

    .field-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 12px;
    }

    .field input {
      width: 100%;
      border: 1px solid #d0d5dd;
      border-radius: 6px;
      padding: 10px 12px;
      font-size: .88rem;
      color: #222;
      outline: none;
      font-family: inherit;
      transition: border-color .18s, box-shadow .18s;
      background: #fafbfc;
    }

    .field input:focus {
      border-color: #0d6efd;
      background: #fff;
      box-shadow: 0 0 0 3px rgba(13,110,253,.12);
    }

    .field input::placeholder { color: #aab0bc; }

    /* ── OPTIONS ROW ────────────────────────────────── */
    .options-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: .8rem;
      margin-bottom: 18px;
    }

    .chk-label {
      display: flex;
      align-items: center;
      gap: 6px;
      color: #555;
      cursor: pointer;
    }

    .chk-label input[type="checkbox"] {
      width: 15px;
      height: 15px;
      accent-color: #0d6efd;
      cursor: pointer;
    }

    .link-btn {
      color: #555;
      text-decoration: none;
      font-size: .8rem;
    }

    .link-btn:hover { color: #0d6efd; text-decoration: underline; }

    .link-blue { color: #0d6efd; text-decoration: none; }
    .link-blue:hover { text-decoration: underline; }

    /* ── SUBMIT BUTTON ──────────────────────────────── */
    .btn-submit {
      width: 100%;
      background: #1a3fc4;
      color: #fff;
      border: none;
      padding: 12px;
      border-radius: 6px;
      font-size: .95rem;
      font-weight: 700;
      cursor: pointer;
      letter-spacing: .4px;
      transition: background .18s, transform .1s;
      font-family: inherit;
    }

    .btn-submit:hover { background: #1535a8; }
    .btn-submit:active { transform: scale(.99); }

    /* ── RECAPTCHA ──────────────────────────────────── */
    .recaptcha-box {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border: 1px solid #d0d5dd;
      border-radius: 4px;
      background: #f8f9fa;
      padding: 10px 12px;
      margin-bottom: 14px;
      max-width: 280px;
    }

    .recaptcha-left {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: .84rem;
      color: #333;
    }

    .recaptcha-left input[type="checkbox"] {
      width: 20px;
      height: 20px;
      accent-color: #0d6efd;
      cursor: pointer;
    }

    .recaptcha-right {
      text-align: right;
      font-size: .58rem;
      color: #888;
      line-height: 1.5;
    }

    .recaptcha-right i {
      font-size: 1.3rem;
      color: #4285f4;
      display: block;
      margin-bottom: 1px;
    }

    /* ── TOAST ──────────────────────────────────────── */
    #toastWrap {
      position: fixed;
      bottom: 24px;
      right: 24px;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .toast {
      background: #1a1a2e;
      color: #fff;
      padding: 12px 20px;
      border-radius: 8px;
      font-size: .88rem;
      font-weight: 600;
      box-shadow: 0 4px 16px rgba(0,0,0,.2);
      animation: slideIn .25s ease;
    }

    @keyframes slideIn {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ── BACK TO TOP ────────────────────────────────── */
    .back-top {
      position: fixed;
      bottom: 20px;
      right: 20px;
      width: 36px;
      height: 36px;
      background: #555;
      color: #fff;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: .85rem;
      box-shadow: 0 2px 8px rgba(0,0,0,.2);
      transition: background .18s;
    }

    .back-top:hover { background: #333; }

    /* ── GOOGLE SVG ─────────────────────────────────── */
    .g-icon { width: 16px; height: 16px; flex-shrink: 0; }
  </style>
</head>
<body>

<!-- NAVBAR -->
<nav class="navbar">
  <a href="index.html" class="nav-logo">
    <div class="nav-logo-icon">L</div>
    <span class="nav-logo-text">Life<span>OS</span></span>
  </a>
  <div class="nav-links">
    <a href="index.html">Home</a>
    <a href="about.html">Our Story</a>
    <a href="blogs.html">Public Blogs</a>
    <a href="login-signup.html" class="active">Login</a>
    <div class="nav-search"><i class="fa-solid fa-magnifying-glass"></i></div>
  </div>
</nav>

<!-- BLUE BANNER -->
<div class="page-banner">
  <h1>Log in / Sign up</h1>
</div>

<!-- DUAL PANEL -->
<div class="page-body">

  <!-- ═══ LEFT: EXISTING USER ═══ -->
  <div class="card">
    <div class="card-head">
      <div class="card-title">
        <i class="fa-regular fa-circle-user"></i>
        Existing User
      </div>
    </div>

    <!-- Social -->
    <div class="social-row">
      <button class="btn-fb" onclick="socialLogin('Facebook')">
        <i class="fa-brands fa-facebook-f"></i> Login with Facebook
      </button>
      <button class="btn-google" onclick="socialLogin('Google')">
        <svg class="g-icon" viewBox="0 0 18 18"><path fill="#4285F4" d="M17.64 9.2c0-.74-.06-1.28-.19-1.84H9v3.34h4.96c-.1.83-.64 2.08-1.84 2.92l2.84 2.2c1.7-1.57 2.68-3.88 2.68-6.62z"/><path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.84-2.2c-.76.53-1.78.9-3.12.9-2.38 0-4.41-1.57-5.13-3.72L.97 13.06C2.45 16 5.48 18 9 18z"/><path fill="#FBBC05" d="M3.87 10.8c-.2-.59-.31-1.22-.31-1.8s.11-1.21.31-1.8L.97 4.94C.35 6.16 0 7.54 0 9s.35 2.84.97 4.06l2.9-2.26z"/><path fill="#EA4335" d="M9 3.58c1.32 0 2.5.45 3.44 1.35l2.58-2.58C13.46.89 11.43 0 9 0 5.48 0 2.45 2 0 4.94l2.9 2.26C3.59 5.05 5.62 3.58 9 3.58z"/></svg>
        Login with Google
      </button>
    </div>

    <div class="or-line"><span>Or</span></div>

    <!-- Login Form -->
    <form id="loginForm" onsubmit="return doLogin(event)">
      <div class="field">
        <input type="email" id="lgEmail" placeholder="Email *" required autocomplete="email">
      </div>
      <div class="field">
        <input type="password" id="lgPass" placeholder="Password *" required autocomplete="current-password">
      </div>

      <div class="options-row">
        <label class="chk-label">
          <input type="checkbox" id="rememberMe" checked>
          Remember me
        </label>
        <a href="#" class="link-btn" onclick="forgotPass(); return false;">Forgot Password?</a>
      </div>

      <button type="submit" class="btn-submit">LOG IN</button>
    </form>
  </div>

  <!-- ═══ RIGHT: NEW REGISTRATION ═══ -->
  <div class="card">
    <div class="card-head">
      <div class="card-title">
        <i class="fa-regular fa-circle-user"></i>
        New Registration
      </div>
      <span class="req-note">* Required Fields</span>
    </div>

    <!-- Social -->
    <div class="social-row">
      <button class="btn-fb" onclick="socialLogin('Facebook')">
        <i class="fa-brands fa-facebook-f"></i> Continue with Facebook
      </button>
      <button class="btn-google" onclick="socialLogin('Google')">
        <svg class="g-icon" viewBox="0 0 18 18"><path fill="#4285F4" d="M17.64 9.2c0-.74-.06-1.28-.19-1.84H9v3.34h4.96c-.1.83-.64 2.08-1.84 2.92l2.84 2.2c1.7-1.57 2.68-3.88 2.68-6.62z"/><path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.84-2.2c-.76.53-1.78.9-3.12.9-2.38 0-4.41-1.57-5.13-3.72L.97 13.06C2.45 16 5.48 18 9 18z"/><path fill="#FBBC05" d="M3.87 10.8c-.2-.59-.31-1.22-.31-1.8s.11-1.21.31-1.8L.97 4.94C.35 6.16 0 7.54 0 9s.35 2.84.97 4.06l2.9-2.26z"/><path fill="#EA4335" d="M9 3.58c1.32 0 2.5.45 3.44 1.35l2.58-2.58C13.46.89 11.43 0 9 0 5.48 0 2.45 2 0 4.94l2.9 2.26C3.59 5.05 5.62 3.58 9 3.58z"/></svg>
        Continue with Google
      </button>
    </div>

    <div class="or-line"><span>Or</span></div>

    <!-- Register Form -->
    <form id="registerForm" onsubmit="return doRegister(event)">
      <div class="field-row">
        <div class="field" style="margin-bottom:0">
          <input type="text" id="rgFirst" placeholder="First Name *" required autocomplete="given-name">
        </div>
        <div class="field" style="margin-bottom:0">
          <input type="text" id="rgLast" placeholder="Last Name *" required autocomplete="family-name">
        </div>
      </div>

      <div class="field">
        <input type="tel" id="rgMobile" placeholder="Mobile *" required autocomplete="tel">
      </div>
      <div class="field">
        <input type="email" id="rgEmail" placeholder="Email *" required autocomplete="email">
      </div>
      <div class="field">
        <input type="password" id="rgPass" placeholder="Password *" required autocomplete="new-password">
      </div>
      <div class="field">
        <input type="password" id="rgConfirm" placeholder="Confirm Password *" required autocomplete="new-password">
      </div>

      <div class="field" style="margin-bottom: 12px;">
        <label class="chk-label" style="font-size:.8rem;">
          <input type="checkbox" id="termsChk" required>
          Accept <a href="privacy.html" class="link-blue" target="_blank">Terms and conditions</a>
        </label>
      </div>

      <!-- reCAPTCHA widget -->
      <div class="recaptcha-box">
        <div class="recaptcha-left">
          <input type="checkbox" id="captchaChk" required>
          <span>I'm not a robot</span>
        </div>
        <div class="recaptcha-right">
          <i class="fa-solid fa-rotate"></i>
          reCAPTCHA<br>Privacy - Terms
        </div>
      </div>

      <button type="submit" class="btn-submit">REGISTER</button>
    </form>
  </div>

</div><!-- /.page-body -->

<div id="toastWrap"></div>

<div class="back-top" onclick="window.scrollTo({top:0,behavior:'smooth'})" title="Back to top">
  <i class="fa-solid fa-angle-up"></i>
</div>

<script>
  const API = (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1')
    ? window.location.origin 
    : 'https://lifeos-backend-zzqm.onrender.com';

  /* ─── Show toast ─── */
  function toast(msg) {
    const wrap = document.getElementById('toastWrap');
    const el = document.createElement('div');
    el.className = 'toast';
    el.textContent = msg;
    wrap.appendChild(el);
    setTimeout(() => el.remove(), 3500);
  }

  /* ─── Save session to localStorage ─── */
  function saveSession(user) {
    localStorage.setItem('lifeos_user_session', JSON.stringify({ success: true, user }));
    localStorage.setItem('m_account', JSON.stringify({
      isLoggedIn: true,
      name:   user.name   || 'Member',
      email:  user.email  || '',
      mobile: user.mobile || ''
    }));
    localStorage.setItem('lifeos_active_workspace', 'private');
  }

  /* ─── Get redirect target ─── */
  function redirectTarget() {
    return new URLSearchParams(window.location.search).get('redirect') || 'index.html';
  }

  /* ─── LOGIN ─── */
  function doLogin(e) {
    e.preventDefault();
    const email = document.getElementById('lgEmail').value.trim();
    const pass  = document.getElementById('lgPass').value;

    if (!email || !pass) { toast('⚠️ Please enter email and password.'); return false; }

    // Save session immediately (offline-first)
    const name = email.split('@')[0];
    saveSession({ name: name.charAt(0).toUpperCase() + name.slice(1), email });
    toast('✅ Logged in successfully!');

    // Sync with server in background
    fetch(API + '/api/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ login: email, email, password: pass })
    }).then(r => r.json()).then(d => {
      if (d && d.success && d.user) saveSession(d.user);
    }).catch(() => {});

    setTimeout(() => { window.location.href = redirectTarget(); }, 700);
    return false;
  }

  /* ─── REGISTER ─── */
  function doRegister(e) {
    e.preventDefault();
    const first   = document.getElementById('rgFirst').value.trim();
    const last    = document.getElementById('rgLast').value.trim();
    const mobile  = document.getElementById('rgMobile').value.trim();
    const email   = document.getElementById('rgEmail').value.trim();
    const pass    = document.getElementById('rgPass').value;
    const confirm = document.getElementById('rgConfirm').value;

    if (pass !== confirm) { toast('❌ Passwords do not match!'); return false; }

    const fullName = `${first} ${last}`.trim() || 'New Member';
    saveSession({ name: fullName, email, mobile });
    toast('🎉 Account created successfully!');

    fetch(API + '/api/auth/register', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name: fullName, email, mobile, password: pass })
    }).then(r => r.json()).then(d => {
      if (d && d.success && d.user) saveSession(d.user);
    }).catch(() => {});

    setTimeout(() => { window.location.href = redirectTarget(); }, 700);
    return false;
  }

  /* ─── SOCIAL LOGIN (GOOGLE / FACEBOOK) ─── */
  function socialLogin(provider) {
    let email = 'siddharthasingh12495@gmail.com';
    let name = 'Siddhartha Singh';

    if (provider === 'Google') {
      const inputEmail = prompt('Google Sign-In Account:', email);
      if (inputEmail === null) return; // User cancelled
      if (inputEmail.trim()) email = inputEmail.trim();
      name = email.split('@')[0].replace(/[._-]/g, ' ').replace(/\b\w/g, c => c.toUpperCase());
    }

    toast(`🔄 Connecting to backend for ${provider} authentication...`);

    fetch(API + '/api/auth/google', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        email: email,
        name: name,
        provider: provider.toLowerCase()
      })
    })
    .then(r => r.json())
    .then(d => {
      if (d && d.success && d.user) {
        saveSession(d.user);
        toast(d.message || `✅ Logged in with ${provider}!`);
        setTimeout(() => { window.location.href = redirectTarget(); }, 1000);
      } else {
        toast('❌ Google Sign-In failed.');
      }
    })
    .catch(err => {
      // Offline / fallback save
      saveSession({ name: name, email: email, provider: provider });
      toast(`✅ Logged in with ${provider}!`);
      setTimeout(() => { window.location.href = redirectTarget(); }, 800);
    });
  }

  /* ─── FORGOT PASSWORD ─── */
  function forgotPass() {
    const em = prompt('Enter your registered email address:');
    if (em && em.includes('@')) toast(`📩 Recovery link sent to ${em}`);
  }

</script>
</body>
</html>
